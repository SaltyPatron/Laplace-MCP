# Laplace-MCP on its runner: the service built with icx as the engine is, with Laplace-Native as part of it and the
# engine's reader from Laplace-Engine (both checked out beside it), under Laplace-Operations' floating-point contract
# (private: the secret LAPLACE_CHECKOUT, agents.sh's), and its own checks. The runner's environment (runner/.env, from
# agents.sh) names its build root and the machine's dependencies, tier 0 and grammars.
name: Laplace-MCP
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  mcp:
    runs-on: [self-hosted, laplace, Laplace-MCP]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { path: Laplace-MCP, persist-credentials: false }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: "${{ github.repository_owner }}/Laplace-Native", ref: eb00ac7f86318127f39605905641f8a90ba70f4e, path: Laplace-Native, persist-credentials: false }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: "${{ github.repository_owner }}/Laplace-Engine", ref: 11f6963af59a8c749b789ea7cf5a8bccc8436915, path: Laplace-Engine, persist-credentials: false }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: "${{ github.repository_owner }}/Laplace-postgres", ref: e9798bea425c6d1489252a74ec9d4fc61756b309, path: Laplace-postgres, persist-credentials: false }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: "${{ github.repository_owner }}/Laplace-Operations", path: Laplace-Operations, token: "${{ secrets.LAPLACE_CHECKOUT }}", persist-credentials: false }
      - name: Provide the pinned Tree-sitter generator toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.90.0
      - name: Select qualified Native inputs for the exact source revision
        env:
          GH_TOKEN: ${{ secrets.LAPLACE_CHECKOUT }}
        run: bash Laplace-Operations/native-inputs.sh prepare "$GITHUB_WORKSPACE/Laplace-Native"
      - name: Verify Native source selection across reconfiguration
        run: cmake "-DSOURCE=$GITHUB_WORKSPACE/Laplace-MCP" "-DWORK=$RUNNER_TEMP/native-source-defaults" -P Laplace-MCP/tests/native-source-defaults.cmake
      - name: build
        run: |
          . /opt/intel/oneapi/setvars.sh >/dev/null 2>&1 || true
          export LAPLACE_SRC=$GITHUB_WORKSPACE LAPLACE_NATIVE=$GITHUB_WORKSPACE/Laplace-Native LAPLACE_OPERATIONS=$GITHUB_WORKSPACE/Laplace-Operations
          export LAPLACE_ENGINE_SRC=$GITHUB_WORKSPACE/Laplace-Engine/src OMP_NUM_THREADS=$(nproc) MKL_NUM_THREADS=$(nproc)
          . Laplace-Operations/laplace.env
          prepared_grammars=$LAPLACE_GRAMMARS
          compiled_grammars="$LAPLACE_BUILD/Laplace-MCP/grammars"
          bash Laplace-Engine/tools/build_grammars.sh Laplace-Engine/recipes/formats/grammars "$compiled_grammars"
          export LAPLACE_GRAMMARS="$RUNNER_TEMP/mcp/grammars"
          python3 Laplace-Operations/installation/artifact_store.py --prepared "$prepared_grammars" --compiled "$compiled_grammars" --output "$LAPLACE_GRAMMARS"
          echo "LAPLACE_GRAMMARS=$LAPLACE_GRAMMARS" >> "$GITHUB_ENV"
          cmake -S Laplace-MCP -B "$LAPLACE_BUILD/Laplace-MCP/icx-release" -G Ninja -DCMAKE_C_COMPILER=icx -DCMAKE_CXX_COMPILER=icpx -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLAPLACE_BUNDLE_ENGINE=ON -DLAPLACE_INSTALL_RECIPE_RESOURCES=OFF \
            -DLAPLACE_TIER0:FILEPATH="$LAPLACE_TIER0" -DLAPLACE_NATIVE:PATH="$LAPLACE_NATIVE" -DLAPLACE_ENGINE_SRC:PATH="$LAPLACE_ENGINE_SRC" -DLAPLACE_OPERATIONS:PATH="$LAPLACE_OPERATIONS"
          cmake --build "$LAPLACE_BUILD/Laplace-MCP/icx-release" --target laplace_engine lpm_program lpm_lib
          # A second build must leave every target current, including the shared Native dependency.
          cmake --build "$LAPLACE_BUILD/Laplace-MCP/icx-release" --target laplace_engine lpm_program lpm_lib | tee "$RUNNER_TEMP/modular-noop.txt"
          grep -Fx 'ninja: no work to do.' "$RUNNER_TEMP/modular-noop.txt"
          echo "built against Laplace-Native $(git -C Laplace-Native rev-parse --short HEAD) and Laplace-Engine $(git -C Laplace-Engine rev-parse --short HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Start the pinned Native PostgreSQL candidate
        run: |
          . Laplace-Operations/laplace.env
          . /opt/intel/oneapi/setvars.sh >/dev/null 2>&1 || true
          export LAPLACE_NATIVE="$GITHUB_WORKSPACE/Laplace-Native"
          python3 Laplace-Engine/tools/ci/postgres.py start "$RUNNER_TEMP/mcp-pg" --source "$GITHUB_WORKSPACE/Laplace-postgres"
      - name: checks
        run: |
          L=$LAPLACE_BUILD/Laplace-MCP/icx-release/lpm
          E=$LAPLACE_BUILD/Laplace-MCP/icx-release/engine/laplace
          [ -s "$LAPLACE_TIER0" ] || { echo "Required tier 0 is missing at $LAPLACE_TIER0; install prepared inputs before verification"; exit 1; }
          "$L" check
          python3 Laplace-MCP/tests/deployment-runtime.py "$L"
          "$L" text 'Sherlock Holmes'
          python3 Laplace-MCP/tests/text-floor.py "$L"
          python3 Laplace-MCP/tests/engine-output.py "$L" "$E"
          python3 Laplace-MCP/tests/serve-auth.py "$L"
          python3 Laplace-MCP/tests/json-arguments.py "$L"
          python3 Laplace-MCP/tests/code-index.py "$L"
          python3 Laplace-MCP/tests/code-semantic.py "$L"
          python3 Laplace-MCP/tests/code-search-eval.py "$L" --min-mrr "${LPM_EVAL_MIN_MRR:-0.45}"
          python3 Laplace-MCP/tests/rerank-length.py "$L"
          TMPDIR=${RUNNER_TEMP:?} LAPLACE_RECIPES=$GITHUB_WORKSPACE/Laplace-Engine/recipes python3 Laplace-MCP/tests/code-where.py "$L" "$E"
          LAPLACE_WORK=${RUNNER_TEMP:?} python3 Laplace-MCP/tests/read-snapshot.py "$L" "$E"
      - name: Stop the private PostgreSQL instance
        if: always()
        run: python3 Laplace-Engine/tools/ci/postgres.py stop "$RUNNER_TEMP/mcp-pg"
  deploy:
    needs: mcp
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, laplace, Laplace-MCP]
    steps:
      - name: Deploy this exact revision through Operations
        env:
          GH_TOKEN: ${{ secrets.LAPLACE_CHECKOUT }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          gh api "repos/$OWNER/Laplace-Operations/dispatches" -f event_type=main-merged \
            -f "client_payload[repository]=$REPOSITORY" -f "client_payload[sha]=$REVISION"
